<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caliah's Christening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: tender, quiet, celebratory — few words, lots of air
   IDEA: a letterpress christening card resting on a soft pink table
   PICTURE: Caliah in an arched chapel-window frame, a fine cross above
   COLOUR and TYPE: blush ground, burgundy ink, a whisper of rose; Pinyon Script name, Cormorant Garamond, Jost for details
   LAYOUT: one centered card; photo and text side by side on wide screens, stacked on phones */
:root{color-scheme:light;--bg:#f6e1e5;--card:#fffafb;--ink:#5c1229;--soft:#8a4a5c;--rose:#e9b7c2;--line:#d9a3b0}
*{box-sizing:border-box;min-width:0}
html{background:#f6e1e5}body{min-height:100vh;background-attachment:fixed}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Jost",system-ui,sans-serif;overflow-x:clip;
  background-image:radial-gradient(circle at 15% 10%,#fbeef1 0,transparent 45%),radial-gradient(circle at 85% 95%,#f1cfd7 0,transparent 50%)}
.wrap{min-height:100vh;display:grid;place-items:center;padding:clamp(16px,4vw,48px)}
.card{position:relative;width:min(960px,100%);background:var(--card);border-radius:6px;
  box-shadow:0 1px 0 #fff inset,0 30px 60px -30px rgba(92,18,41,.35),0 8px 20px -12px rgba(92,18,41,.2);
  display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,4vw,56px);align-items:center;
  padding:clamp(22px,4vw,56px);animation:rise 1.1s ease-out both}
.card::before{content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:3px;pointer-events:none}
.photo{position:relative;justify-self:center;width:min(100%,360px)}
.arch{aspect-ratio:3/4;border-radius:999px 999px 8px 8px;overflow:hidden;border:6px solid #fff;
  outline:1px solid var(--line);outline-offset:6px;box-shadow:0 18px 40px -20px rgba(92,18,41,.45)}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.text{text-align:center;display:flex;flex-direction:column;align-items:center}
.cross{width:22px;height:34px;margin-bottom:14px}
.lead{font:italic 400 clamp(17px,2vw,20px)/1.4 "Cormorant Garamond",serif;color:var(--soft);margin:0}
.of{font:500 13px/1 "Jost",sans-serif;letter-spacing:.04em;color:var(--soft);margin:14px 0 2px}
h1{font:400 clamp(48px,7vw,76px)/1.05 "Pinyon Script",cursive;margin:6px 0 0;color:var(--ink);text-wrap:balance}
.last{font:600 clamp(20px,2.4vw,26px)/1 "Cormorant Garamond",serif;letter-spacing:.12em;margin:8px 0 0}
.rule{display:flex;align-items:center;gap:12px;width:min(260px,80%);margin:22px 0;color:var(--line)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:currentColor}
.rule svg{width:14px;height:14px;fill:var(--rose)}
.date{font:500 clamp(22px,2.6vw,28px)/1.2 "Cormorant Garamond",serif;margin:0}
.day{font-size:14px;color:var(--soft);margin:4px 0 0}
.venues{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;width:100%;margin-top:24px}
.venue h2{font:500 13px/1.3 "Jost",sans-serif;color:var(--soft);margin:0 0 6px;letter-spacing:.03em}
.venue p{font:500 18px/1.3 "Cormorant Garamond",serif;margin:0 0 12px;text-wrap:balance}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;
  font:500 14px/1 "Jost",sans-serif;text-decoration:none;color:var(--ink);border:1px solid var(--ink);transition:background .2s,color .2s}
.btn svg{width:14px;height:14px;fill:currentColor}
.btn:hover,.btn:focus-visible{background:var(--ink);color:#fff;outline:none}
.btn:focus-visible{box-shadow:0 0 0 3px var(--rose)}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover,.btn.solid:focus-visible{background:#7a1a38}
.note{font:italic 400 17px/1.4 "Cormorant Garamond",serif;color:var(--soft);margin:26px 0 0}

.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.wrap{position:relative;z-index:1}.sky.back{z-index:0}
.bird{position:absolute;left:0;width:var(--s,54px);opacity:var(--o,.95);animation:fly var(--d,18s) linear var(--dl,0s) infinite;will-change:transform}
.bird svg{width:100%;display:block;overflow:visible;filter:drop-shadow(0 2px 2px rgba(92,18,41,.35)) drop-shadow(0 8px 10px rgba(92,18,41,.18));animation:bob 2.6s ease-in-out infinite}
.bird .w{transform-origin:30px 21px;animation:flap .55s ease-in-out infinite alternate}
.bird .w2{animation-delay:-.05s}
@keyframes fly{from{transform:translate(-12vw,var(--y,20vh))}to{transform:translate(112vw,calc(var(--y,20vh) - 14vh))}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.3)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.petal{position:absolute;top:-30px;width:var(--w,12px);height:calc(var(--w,12px)*.7);border-radius:60% 0 60% 0;background:var(--c,#e9b7c2);opacity:.75;animation:fall var(--d,14s) linear var(--dl,0s) infinite}
@keyframes fall{from{transform:translate(0,-5vh) rotate(0)}50%{transform:translate(6vw,50vh) rotate(180deg)}to{transform:translate(-3vw,108vh) rotate(380deg)}}
.text>*{animation:fadeUp .9s ease-out both}
.text>*:nth-child(1){animation-delay:.5s}.text>*:nth-child(2){animation-delay:.7s}.text>*:nth-child(3){animation-delay:.95s}
.text>*:nth-child(4){animation-delay:1.1s}.text>*:nth-child(5){animation-delay:1.25s}.text>*:nth-child(6){animation-delay:1.4s}
.text>*:nth-child(7){animation-delay:1.5s}.text>*:nth-child(8){animation-delay:1.65s}.text>*:nth-child(9){animation-delay:1.8s}
.arch img{animation:breathe 14s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.06)}}
.rule svg{animation:beat 1.8s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.bird,.petal,.bird svg,.bird .w,.text>*,.arch img,.rule svg{animation:none}.bird,.petal{display:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:760px){
  .card{grid-template-columns:minmax(0,1fr);gap:26px;padding:32px 22px 34px}
  .photo{width:min(72%,280px)}
}
@media(max-width:440px){.venues{grid-template-columns:minmax(0,1fr);gap:22px}.photo{width:78%}}
</style>
</head>
